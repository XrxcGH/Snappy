[package]
name = "snappy"
version = "0.1.0-beta.1"
description = "Snappy: organize your own Snapchat data export, on your device."
authors = ["Snappy contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "snappy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Deliberately small: the shell and the native file dialog (shown from Rust). No file-system, http,
# shell, opener, updater or telemetry plugin. Do not add one. The updater is our own code (src/updater): no updater plugin.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# The update manifest (a small JSON file) is parsed here. Already in the tree through tauri.
serde_json = "1"
# The update signature check (minisign, no dependencies of its own) and the digest of a rejected signature.
minisign-verify = "0.3"
sha2 = "0.10"

# Windows only: switch off SmartScreen and autofill on the live WebView2 controller (see lib.rs).
# Both are already dependencies of the system-webview layer; neither has any network code.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[features]
# Test builds only: keeps the WEBVIEW2_* environment variables (a debugging port for Playwright, a
# scratch profile) that release builds remove. Never enabled by the release workflow.
dev-hooks = []
# End-to-end update tests only: points the updater at a loopback server and trusts a TEST key
# instead of the release keys. build.rs refuses it in a release build and outside the E2E identity.
dev-update-endpoint = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
