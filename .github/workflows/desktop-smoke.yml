name: Desktop smoke build

# Two checks that the desktop shell still builds. The Windows job is cheap: a debug build of the app with no
# installer bundling (so no NSIS or WiX downloads). The macOS job is the whole thing: an unsigned universal
# release build, the disk image, and a smoke test of the finished app on the runner. They run only when something
# the shell is made of changed. The full installers are built by release.yml when a version tag is pushed.
#
# Budget of the Windows job: it is capped at 15 minutes. A cold debug build of this app (about 410 crates) took 4 min
# on a 20-thread desktop; it has not been timed on a 4-core GitHub runner, where a cold run could take
# 2 to 3 times as long. The Rust cache makes later runs short, and the push trigger below fills the cache
# on main so that pull requests start from it. If a cold run ever hits the cap, delete this job
# rather than raising the cap.

# Secrets and pull requests: this workflow references no secret, uses `pull_request` (never
# `pull_request_target`), and every job is read-only, so a pull request from a fork or from Dependabot cannot
# reach anything. A manual run (workflow_dispatch) from any branch is harmless for the same reason: there is
# nothing here to steal and nothing it can publish. The Rust cache that pull requests restore is written only
# by runs on main; a pull request's own cache is scoped to that pull request.
# `npm ci --ignore-scripts` (no install script runs) and `--locked` (Cargo.lock is used as it is).

on:
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "apps/dashboard/**"
      - "packages/core/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-smoke.yml"
  pull_request:
    paths:
      - "apps/app/**"
      - "apps/dashboard/**"
      - "packages/core/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with release.yml. Bump deliberately.
  RUST_VERSION: "1.98.1"

jobs:
  windows-debug-build:
    name: Windows debug build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/app/src-tauri -> target
      - run: npm ci --ignore-scripts
      - name: Build the app (debug, no installer)
        run: npm run tauri -w @snappy-export/app -- build --debug --no-bundle -- --locked
      - name: Rust unit tests (navigation allow-list, read-only file table)
        working-directory: apps/app/src-tauri
        run: cargo test --lib --locked
      - name: Check the executable exists
        shell: bash
        run: |
          set -euo pipefail
          exe=apps/app/src-tauri/target/debug/snappy.exe
          test -f "$exe"
          ls -l "$exe"

  # The macOS beta: builds the UNSIGNED universal (Apple silicon + Intel) app and its disk image on an Apple silicon
  # runner, then starts the finished app and checks it. No secret, no signing identity and no Apple variable at
  # all: the ad-hoc signature (an Apple silicon app must carry some signature to run) comes from the "-" in
  # tauri.macos.conf.json, and the smoke test fails if the result is anything but ad hoc. Read-only token. The
  # checks are in apps/app/tools/macos/smoke.sh and what they can and cannot show is in docs/RELEASES.md.
  macos-universal-build:
    name: macOS universal build and smoke test
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BUNDLE_ROOT: apps/app/src-tauri/target/universal-apple-darwin/release/bundle
      OUT: macos-evidence
      OBSERVE_SECONDS: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install Rust and both Mac targets
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/app/src-tauri -> target
      - run: npm ci --ignore-scripts
      - name: Build the dashboard and the desktop frontend
        run: |
          set -euo pipefail
          npm run build:dashboard
          npm run frontend -w @snappy-export/app
      - name: Rust unit tests (navigation allow-list, read-only file table)
        working-directory: apps/app/src-tauri
        run: cargo test --lib --locked
      - name: Build the universal app and disk image (unsigned)
        run: npm run tauri -w @snappy-export/app -- build --target universal-apple-darwin --bundles dmg,app -- --locked
      - name: Check the lock files did not change
        run: git diff --exit-code -- package-lock.json apps/app/src-tauri/Cargo.lock
      - name: Smoke test the built app (bundle, launch, window, 60 seconds of network watching, exit)
        run: bash apps/app/tools/macos/smoke.sh
      - name: Upload the disk image, the app archive and their checksums
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snappy-macos-universal-unsigned
          path: macos-evidence/files/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload the evidence (screenshots, signature, architectures, plist, connection log)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-smoke-evidence
          path: |
            macos-evidence/*.txt
            macos-evidence/*.log
            macos-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
