name: Release

# Builds the Snappy apps when a version tag is pushed, signs them in a separate job, and attaches them to a
# DRAFT GitHub Release. Nothing here publishes anything: a maintainer reads the draft, tests the files, then
# publishes by hand.
#
#   git tag v0.2.0 && git push origin v0.2.0     (the tag must point at a commit on main, and match the
#                                                 version in tauri.conf.json, package.json and Cargo.toml)
#
# Run it by hand (Actions > Release > Run workflow) to try the builds without a tag: it builds UNSIGNED files and
# uploads them as workflow artifacts. A manual run never signs, never reads a secret and never creates a release.
#
# THE SHAPE OF THE PIPELINE (why it is split)
#
#   verify  ->  desktop, android   ->  sign-windows, sign-macos, sign-android  ->  attest  ->  release
#   no secrets  BUILD jobs: run npm,   SIGN jobs: get the finished files and       no secrets   writes a
#               cargo, build.rs and    the signing secrets. They never run npm,     id-token     DRAFT; the only
#               proc macros (about     cargo, build scripts or any repository       only         job with
#               410 crates). NO        code. NO checkout.                                        contents: write
#               secrets, no environment, read-only token.
#
# A compromised dependency can therefore run in the build jobs and still finds no key, no certificate and no
# secret there. The signing jobs run only a short list of trusted tools on the finished installers: signtool,
# codesign, notarytool, apksigner, jarsigner, gpg and gh.
#
# WHEN SECRETS ARE REACHABLE
#
#   Only the sign jobs and the release job reference a secret, only when verify says this is an OFFICIAL run
#   (a push of a tag vX.Y.Z whose commit is an ancestor of origin/main), and only after the 'release'
#   environment approves. A manual run is never official, so every one of those jobs is skipped.
#   Fork pull requests and Dependabot pull requests never run this workflow at all (it has no pull_request
#   trigger) and the other workflows reference no secret.
#
# MAINTAINER PREREQUISITES: do all of these BEFORE adding the first secret (details in docs/RELEASES.md)
#
#   1. Create the environment "release" (Settings > Environments). Add a required reviewer. Under "Deployment
#      branches and tags" allow only the tag pattern v*. Store EVERY signing secret in that environment and
#      none at repository level (a repository secret is readable by any workflow run, on any branch).
#   2. Add a tag ruleset that restricts who can create tags matching v*.
#   3. Settings > Actions > General: workflow permissions read-only; require approval for fork pull requests.
#   4. Optional: turn on immutable releases, so published files cannot be swapped later.
#
# The secrets (all optional; with none of them the release still builds, unsigned):
#
#   Windows   WINDOWS_CERTIFICATE (base64 of a .pfx), WINDOWS_CERTIFICATE_PASSWORD
#   macOS     APPLE_CERTIFICATE (base64 of a Developer ID Application .p12), APPLE_CERTIFICATE_PASSWORD,
#             APPLE_SIGNING_IDENTITY; and, to notarize as well, APPLE_ID, APPLE_PASSWORD (an app-specific
#             password), APPLE_TEAM_ID
#   Android   ANDROID_KEYSTORE_BASE64 (base64 of a .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#             ANDROID_KEY_PASSWORD
#   Checksums SNAPPY_GPG_PRIVATE_KEY (ASCII-armored), SNAPPY_GPG_PASSPHRASE (may be empty)
#
# What it builds
#   Windows   NSIS installer (.exe) and MSI                          windows-latest
#   macOS     .dmg for Apple silicon and for Intel                   macos-latest (Intel is cross-compiled)
#   Linux     AppImage, .deb and .rpm                                ubuntu-22.04 (oldest glibc we support)
#   Android   universal APK and AAB                                  ubuntu-latest
#   iOS       DISABLED, see the comment on the ios job
#   plus a SHA256SUMS file over every file (and SHA256SUMS.asc when a GPG key secret exists).
#
# Ground rules
#   * Third-party actions are pinned to a full commit SHA; the comment names the release.
#   * Every job states its permissions. The default is read-only; sign jobs have none; only the last job writes.
#   * Secrets are passed only to the one step that needs them, as environment variables, and never echoed.
#   * No build cache is restored here: a release is built from the tagged source and the lock files.
#   * npm runs with --ignore-scripts (no package install script runs) and cargo runs with --locked.
#   * Building needs a network (crates, npm packages, NSIS and WiX tools). The app itself makes no connections.
#   * apps/app/test/workflows.test.ts reads every workflow file and fails on the common ways the above can stop
#     being true. It is a tripwire, not a proof: review changes to these files by hand as well.
#
# KNOWN GAP: the Windows signature is put on the finished installers (.exe and .msi), not on the program file
# inside them, because signing that file would need the build to run with the certificate. The release notes
# say so. If Smart App Control turns out to block the installed program, move to SignPath or Azure Artifact
# Signing (keyless, OIDC) rather than putting the certificate back into the build job.
#
# STATUS: written but not yet run on GitHub. The Windows build steps mirror what was run by hand (tauri build,
# NSIS and MSI). The macOS, Linux and Android jobs and every signing job have never been executed anywhere:
# expect to fix things on the first run, and run it on a throwaway tag in a fork first.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  # The toolchain the desktop app was first built and run with. Bump deliberately.
  RUST_VERSION: "1.98.1"
  # Releases come from this branch only.
  RELEASE_BRANCH: main

jobs:
  # ---------------------------------------------------------------------------------------------
  # Gate. No secrets. Decides whether this run is OFFICIAL (may sign and may draft a release):
  # a push of a tag vX.Y.Z whose commit is on main. Then checks the version, the tests and the
  # no-network dependency guard. Nothing is built until this is green.
  # ---------------------------------------------------------------------------------------------
  verify:
    name: Verify the tag, tests and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      official: ${{ steps.version.outputs.official }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the check below can ask whether the tag is on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Work out the version, check it everywhere, and decide whether this run is official
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          conf=$(node -p "require('./apps/app/src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./apps/app/package.json').version")
          crate=$(sed -n '/^version = "/{s/^version = "\(.*\)"$/\1/p;q}' apps/app/src-tauri/Cargo.toml)
          official=false
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            # Plain X.Y.Z only: the Windows MSI format rejects most pre-release suffixes.
            if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The tag '$REF_NAME' is not of the form vX.Y.Z."
              exit 1
            fi
            # The tagged commit must already be on the release branch, which means it went through review.
            # A tag on any other commit never builds, signs or drafts anything.
            if ! git rev-parse --verify --quiet "refs/remotes/origin/${RELEASE_BRANCH}^{commit}" > /dev/null; then
              echo "::error::Could not find origin/${RELEASE_BRANCH} to check the tag against."
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD "origin/${RELEASE_BRANCH}"; then
              echo "::error::The tag '$REF_NAME' points at $(git rev-parse --short HEAD), which is not on ${RELEASE_BRANCH}. Merge it first, then tag the merged commit."
              exit 1
            fi
            version="${REF_NAME#v}"
            official=true
          else
            version="$conf"
            echo "::notice::Manual run (or a ref that is not a tag push): this run is not official. It builds unsigned files, reads no secret and creates no release."
          fi
          echo "tauri.conf.json: $conf, apps/app/package.json: $pkg, Cargo.toml: $crate, release: $version, official: $official"
          for v in "$conf" "$pkg" "$crate"; do
            if [ "$v" != "$version" ]; then
              echo "::error::A version in the repository ($v) does not match the release version ($version). Bump all three and tag again."
              exit 1
            fi
          done
          {
            echo "version=$version"
            echo "official=$official"
          } >> "$GITHUB_OUTPUT"
      # --ignore-scripts: no package's install script runs. Only esbuild has one, and it only checks its own
      # binary; the dashboard build and the whole test suite were run without it.
      - run: npm ci --ignore-scripts
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Tests
        run: npm test
      - name: Build the dashboard
        run: npm run build:dashboard
      - name: Check the Rust dependency tree has no network crates
        run: node apps/app/tools/check-no-network-deps.mjs

  # ---------------------------------------------------------------------------------------------
  # Desktop BUILD: one job per row. NO secrets, no environment, read-only token. Runs untrusted build code.
  # Each uploads its UNSIGNED installers. Linux has no signing step, so its files are already final.
  # macOS also uploads the unpacked .app, so the signing job can sign it and make its own .dmg.
  # ---------------------------------------------------------------------------------------------
  desktop:
    name: Build desktop (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis,msi
            target: ""
            stage: unsigned
            expect: "exe msi"
          - name: macos-arm64
            os: macos-latest
            bundles: dmg
            target: aarch64-apple-darwin
            stage: unsigned
            expect: "dmg"
          - name: macos-x64
            os: macos-latest # an Apple silicon runner; the Intel app is cross-compiled
            bundles: dmg
            target: x86_64-apple-darwin
            stage: unsigned
            expect: "dmg"
          - name: linux-x64
            # Built on the oldest Ubuntu we support, because an AppImage needs at least the glibc of the
            # machine that built it, and WebKitGTK 4.1 (which Tauri 2 needs) first shipped in 22.04.
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
            target: ""
            stage: final
            expect: "AppImage deb rpm"
    env:
      NAME: ${{ matrix.name }}
      BUNDLES: ${{ matrix.bundles }}
      TARGET: ${{ matrix.target }}
      STAGE: ${{ matrix.stage }}
      EXPECT: ${{ matrix.expect }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          if [ -n "$TARGET" ]; then rustup target add "$TARGET"; fi
          rustc --version
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --ignore-scripts

      - name: Build (unsigned; this job has no secrets)
        shell: bash
        env:
          # Needed by the AppImage tool on runners without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Ad-hoc signature ("-" is not a secret): an Apple silicon app must carry some signature to run.
            # The signing job replaces it with the Developer ID signature when that certificate exists.
            export APPLE_SIGNING_IDENTITY="-"
          fi
          args=(build --bundles "$BUNDLES")
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          # Everything after the second -- goes to cargo: the lock file is used as it is.
          args+=(-- --locked)
          npm run tauri -w @snappy-export/app -- "${args[@]}"

      - name: Check the lock files did not change
        shell: bash
        run: git diff --exit-code -- package-lock.json apps/app/src-tauri/Cargo.lock

      - name: Collect the installers
        shell: bash
        run: |
          set -euo pipefail
          root=apps/app/src-tauri/target
          if [ -n "$TARGET" ]; then root="$root/$TARGET"; fi
          mkdir -p out status app-out
          find "$root/release/bundle" -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} out/ \;
          for ext in $EXPECT; do
            if ! ls out/*."$ext" > /dev/null 2>&1; then
              echo "::error::No .$ext file was produced for $NAME."
              exit 1
            fi
          done
          if [ "$RUNNER_OS" = "macOS" ]; then
            # tar keeps symlinks and permissions, which a zipped artifact would lose.
            app=$(find "$root/release/bundle/macos" -maxdepth 1 -name '*.app' -type d -print -quit)
            if [ -z "$app" ]; then
              echo "::error::No .app bundle was left next to the .dmg for $NAME."
              exit 1
            fi
            tar -C "$(dirname "$app")" -cf "app-out/${NAME}.app.tar" "$(basename "$app")"
          fi
          if [ "$STAGE" = "final" ]; then
            echo "$NAME: no code signing exists for these formats. Verify the checksums." > "status/${NAME}.txt"
          fi
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.stage }}-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload the unpacked macOS app for the signing job
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.name }}
          path: app-out/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload the status line
        if: matrix.stage == 'final'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status-${{ matrix.name }}
          path: status/${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------------
  # Android BUILD: universal APK and AAB, unsigned. NO secrets, no environment, read-only token.
  # continue-on-error is on because this job has not run yet and the mobile shell has never been built.
  # Remove it (here and on sign-android) once the job is proven, so a broken Android build blocks the release.
  # While it is on, a missing Android file is made visible in the release notes (see the release job).
  # ---------------------------------------------------------------------------------------------
  android:
    name: Build Android (APK and AAB, unsigned)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Rust and the Android targets
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Point the build at the runner's Android SDK and NDK
        run: |
          set -euo pipefail
          # ubuntu-latest ships the SDK and an NDK. Accept the SDK licenses so Gradle can fetch any platform it needs.
          echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci --ignore-scripts
      - name: Create the Android project
        run: npm run tauri -w @snappy-export/app -- android init --ci
      - name: Remove the INTERNET permission from the manifest
        run: |
          set -euo pipefail
          # The generated project asks for INTERNET because the development server needs it. A release
          # serves the bundled page in-process and needs no network, so the app must not be able to ask.
          manifest=apps/app/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/d' "$manifest"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::INTERNET is still in the manifest."
            exit 1
          fi
      - name: Build the unsigned APK and AAB
        run: npm run tauri -w @snappy-export/app -- android build --apk --aab --ci
      - name: Check the lock files did not change
        run: git diff --exit-code -- package-lock.json apps/app/src-tauri/Cargo.lock
      - name: Collect the unsigned files and check the permissions
        run: |
          set -euo pipefail
          gen=apps/app/src-tauri/gen/android/app/build/outputs
          unsigned_apk=$(find "$gen/apk" -name '*unsigned.apk' -print -quit)
          unsigned_aab=$(find "$gen/bundle" -name '*.aab' -print -quit)
          if [ -z "$unsigned_apk" ] || [ -z "$unsigned_aab" ]; then
            echo "::error::The Android build did not produce an unsigned APK and AAB."
            exit 1
          fi
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          mkdir -p out
          apk="out/Snappy_${VERSION}_android-universal-unsigned.apk"
          "$bt/zipalign" -f -p 4 "$unsigned_apk" "$apk"
          cp "$unsigned_aab" "out/Snappy_${VERSION}_android-universal-unsigned.aab"
          # Read the output first and search it afterwards: with `set -o pipefail`, `aapt2 | grep -q` can be
          # cut short by grep and report the wrong answer.
          perms=$("$bt/aapt2" dump permissions "$apk")
          echo "Permissions in the APK:"
          echo "$perms"
          if grep -q 'android.permission.INTERNET' <<< "$perms"; then
            echo "::error::The APK asks for the INTERNET permission."
            exit 1
          fi
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-android
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------------
  # iOS: DISABLED ON PURPOSE (it runs only if the repository variable SNAPPY_ENABLE_IOS is the text true).
  # Putting Snappy on anyone's iPhone needs the Apple Developer Program (USD 99 per year), an App Store
  # Connect API key, and a distribution certificate plus provisioning profile. There is no free route and no
  # unsigned iOS file to hand out. Nobody has built the iOS shell yet (it can only be built on macOS).
  #
  # This job holds NO secrets and no environment, like every other build job: all it does is check that the
  # iOS project can be generated. Signing the app is NOT written. It must follow the same split as the other
  # platforms before it is turned on: build an unsigned archive here, then export and sign it in a separate
  # job that receives only that archive and the secrets and runs no npm or cargo (xcodebuild -exportArchive
  # and the App Store Connect upload). Do not put the certificate into this job.
  # ---------------------------------------------------------------------------------------------
  ios:
    name: iOS (disabled, project check only)
    if: ${{ vars.SNAPPY_ENABLE_IOS == 'true' }}
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust and the iOS target
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustup target add aarch64-apple-ios
      - run: npm ci --ignore-scripts
      - name: Create the iOS project
        run: npm run tauri -w @snappy-export/app -- ios init --ci

  # ---------------------------------------------------------------------------------------------
  # SIGN jobs. Run only for an OFFICIAL run, after every build job has finished (so a partial release is never
  # signed, and one approval of the 'release' environment covers all of them). Each receives the finished
  # files and, in the one step that needs them, its secrets. No checkout, no npm, no cargo, no build script,
  # and the GitHub token has no permissions at all. With no secrets the job passes the files through unsigned.
  # ---------------------------------------------------------------------------------------------
  sign-windows:
    name: Sign Windows installers
    needs: [verify, desktop, android]
    if: ${{ !cancelled() && needs.verify.outputs.official == 'true' && needs.desktop.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-windows-x64
          path: in
      # The build job is untrusted, so what it uploaded is checked before any secret is read: exactly one
      # .exe and one .msi, plain names, nothing else (no folder, no extra file).
      - name: Check the files from the build (no secrets in this step)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $items = @(Get-ChildItem -Path in -Force -Recurse)
          $odd = @($items | Where-Object { $_.PSIsContainer -or $_.Name -notmatch '^[A-Za-z0-9._-]+\z' -or $_.Extension -notin '.exe', '.msi' })
          if ($odd.Count -gt 0) { throw "The build artifact holds something other than plain .exe and .msi files: $($odd.Name -join ', ')" }
          foreach ($ext in '.exe', '.msi') {
            $n = @($items | Where-Object { $_.Extension -eq $ext }).Count
            if ($n -ne 1) { throw "Expected exactly one $ext file in the build artifact, found $n." }
          }
      - name: Import the certificate (only when the secret exists)
        id: cert
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Host 'No Windows signing certificate secret: the installers will stay unsigned.'
            'thumbprint=' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'snappy-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          # Not -Exportable: the key can sign here but cannot be copied out of the store.
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host 'Windows signing certificate imported.'
      - name: Sign the installers
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path out, status | Out-Null
          Copy-Item -Path 'in\*' -Destination out
          if ([string]::IsNullOrEmpty($env:THUMBPRINT)) {
            $line = 'windows-x64: unsigned. Windows SmartScreen shows a warning on first run, and Smart App Control blocks it.'
            Set-Content -Path status/windows-x64.txt -Value $line -Encoding utf8
            Write-Host $line
            exit 0
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe was not found on this runner.' }
          foreach ($f in Get-ChildItem out -File) {
            & $signtool.FullName sign /fd sha256 /td sha256 /tr http://timestamp.digicert.com /sha1 $env:THUMBPRINT $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool could not sign $($f.Name)." }
            & $signtool.FullName verify /pa $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "The signature on $($f.Name) does not verify." }
          }
          $line = 'windows-x64: the installers (.exe and .msi) are Authenticode signed. The program file inside them is not signed separately.'
          Set-Content -Path status/windows-x64.txt -Value $line -Encoding utf8
          Write-Host $line
      - name: Remove the certificate from the runner
        if: always() && steps.cert.outputs.thumbprint != ''
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: |
          Remove-Item -Path "Cert:\CurrentUser\My\$($env:THUMBPRINT)" -Force -ErrorAction SilentlyContinue
      - name: Show the signature state
        shell: pwsh
        run: |
          Get-ChildItem out | ForEach-Object { '{0} = {1}' -f $_.Name, (Get-AuthenticodeSignature $_.FullName).Status }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final-windows-x64
          path: out/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status-windows-x64
          path: status/windows-x64.txt
          if-no-files-found: error
          retention-days: 14

  sign-macos:
    name: Sign and notarize (${{ matrix.name }})
    needs: [verify, desktop, android]
    if: ${{ !cancelled() && needs.verify.outputs.official == 'true' && needs.desktop.result == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 90
    environment: release
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        name: [macos-arm64, macos-x64]
    env:
      NAME: ${{ matrix.name }}
      # Fixed names, set here and never taken from the build artifact. Nothing from the artifact is written to
      # GITHUB_ENV or GITHUB_PATH, because a crafted file name could then plant variables or functions that the
      # steps holding the Apple secrets would run under.
      APP_PATH: work/Snappy.app
      DMG_PATH: out/Snappy.dmg
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-${{ matrix.name }}
          path: in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-${{ matrix.name }}
          path: app-in
      # The build job is untrusted, so what it uploaded is checked before any secret is read: exactly one .dmg
      # and exactly one app archive, plain names, and an archive whose every entry is inside Snappy.app.
      # The only value passed on is the .dmg name, and only after it matched the plain-name pattern.
      - name: Check the files from the build and unpack the app (no secrets in this step)
        id: check
        run: |
          set -euo pipefail
          safe='^[A-Za-z0-9._-]+$'
          # To stderr, so the message is not swallowed when fail runs inside $( ).
          fail() { echo "::error::$1" >&2; exit 1; }

          # only_file DIR SUFFIX: print the name of the one plain file in DIR, or stop.
          only_file() {
            local dir="$1" suffix="$2" count=0 name="" f
            while IFS= read -r -d '' f; do
              count=$((count + 1))
              name="${f#"$dir"/}"
              if [ -L "$f" ] || [ ! -f "$f" ] || [[ ! "$name" =~ $safe ]] || [[ "$name" != *"$suffix" ]]; then
                fail "Unexpected entry in the $dir artifact."
              fi
            done < <(find "$dir" -mindepth 1 -print0)
            if [ "$count" -ne 1 ]; then fail "Expected exactly one $suffix file in the $dir artifact, found $count entries."; fi
            printf '%s' "$name"
          }

          dmg_name=$(only_file in .dmg)
          archive_name=$(only_file app-in .app.tar)
          if [ "$archive_name" != "${NAME}.app.tar" ]; then fail "Unexpected app archive name."; fi

          listing=$(tar -tf "app-in/$archive_name")
          if [ -z "$listing" ]; then fail "The app archive is empty."; fi
          outside=$(grep -Ev '^Snappy\.app(/[^[:cntrl:]]*)?$' <<< "$listing" || true)
          if [ -n "$outside" ]; then fail "The app archive holds entries outside Snappy.app."; fi
          if grep -Eq '(^|/)\.\.(/|$)' <<< "$listing"; then fail "The app archive holds a .. path."; fi

          mkdir -p work
          tar -C work -xf "app-in/$archive_name"
          if [ ! -d "$APP_PATH" ] || [ -L "$APP_PATH" ]; then fail "No Snappy.app after unpacking."; fi
          if [ "$(find work -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -ne 1 ]; then fail "The archive unpacked to more than Snappy.app."; fi
          echo "dmg_name=$dmg_name" >> "$GITHUB_OUTPUT"
      - name: Import the certificate into a temporary keychain (only when the secret exists)
        id: keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate secret: the app keeps its ad-hoc signature."
            echo "signing=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/snappy-signing.keychain-db"
          cert="$RUNNER_TEMP/snappy-signing.p12"
          keychain_password=$(openssl rand -hex 16)
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          # Stay unlocked for the whole job; the keychain is deleted at the end.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          rm -f "$cert"
          {
            echo "signing=yes"
            echo "keychain=$keychain"
          } >> "$GITHUB_OUTPUT"
      - name: Sign the app
        if: steps.keychain.outputs.signing == 'yes'
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
      - name: Notarize the app and staple the ticket (only when the Apple ID secrets exist)
        id: notarize-app
        if: steps.keychain.outputs.signing == 'yes'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Apple ID secrets are missing: signed, but not notarized."
            echo "notarized=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          zip="$RUNNER_TEMP/app-for-notary.zip"
          ditto -c -k --keepParent "$APP_PATH" "$zip"
          xcrun notarytool submit "$zip" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 45m
          rm -f "$zip"
          # Stapling fails if Apple did not accept the app, so a rejected notarization stops the job here.
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          echo "notarized=yes" >> "$GITHUB_OUTPUT"
      - name: Make the disk image from the signed app and sign it
        if: steps.keychain.outputs.signing == 'yes'
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          mkdir -p out
          staging=$(mktemp -d)
          cp -R "$APP_PATH" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Snappy" -srcfolder "$staging" -ov -format UDZO "$DMG_PATH"
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"
      - name: Notarize the disk image and staple the ticket
        if: steps.keychain.outputs.signing == 'yes' && steps.notarize-app.outputs.notarized == 'yes'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$DMG_PATH" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 45m
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
      - name: Write the status line and collect the files
        env:
          SIGNING: ${{ steps.keychain.outputs.signing }}
          NOTARIZED: ${{ steps.notarize-app.outputs.notarized }}
          DMG_NAME: ${{ steps.check.outputs.dmg_name }}
        run: |
          set -euo pipefail
          mkdir -p out status
          if [ "$SIGNING" = "yes" ]; then
            # Give the signed disk image the name the build gave its own (checked as a plain name earlier).
            mv "$DMG_PATH" "out/$DMG_NAME"
            if [ "$NOTARIZED" = "yes" ]; then
              line="$NAME: signed with a Developer ID certificate and notarized by Apple."
            else
              line="$NAME: signed with a Developer ID certificate, not notarized. macOS shows a warning on first open."
            fi
          else
            cp in/*.dmg out/
            line="$NAME: ad-hoc signed only (no Apple certificate). macOS shows a warning on first open."
          fi
          echo "$line" > "status/${NAME}.txt"
          echo "$line"
          ls -l out
      - name: Show what Gatekeeper says (information only)
        run: |
          spctl --assess --type open --context context:primary-signature --verbose=2 out/*.dmg || true
      - name: Delete the temporary keychain
        if: always() && steps.keychain.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status-${{ matrix.name }}
          path: status/${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 14

  sign-android:
    name: Sign Android (APK and AAB)
    needs: [verify, desktop, android]
    if: ${{ !cancelled() && needs.verify.outputs.official == 'true' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same continue-on-error as the Android build, for the same reason.
    continue-on-error: true
    environment: release
    permissions: {}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-android
          path: in
      # The build job is untrusted, so what it uploaded is checked before any secret is read: exactly the one
      # APK and the one AAB the build job names, and nothing else.
      - name: Check the files from the build (no secrets in this step)
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' "in/Snappy_${VERSION}_android-universal-unsigned.aab" "in/Snappy_${VERSION}_android-universal-unsigned.apk")
          found=$(find in -mindepth 1 | LC_ALL=C sort)
          if [ "$found" != "$expected" ]; then
            echo "::error::The unsigned Android artifact must hold exactly the one APK and the one AAB, and nothing else. Found:"
            echo "$found"
            exit 1
          fi
          for f in $expected; do
            if [ -L "$f" ] || [ ! -f "$f" ]; then
              echo "::error::$f is not a plain file."
              exit 1
            fi
          done
      - name: Sign with the release key if the secrets exist, otherwise with a throwaway key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Fixed names, as the previous step checked them.
          unsigned_apk="in/Snappy_${VERSION}_android-universal-unsigned.apk"
          unsigned_aab="in/Snappy_${VERSION}_android-universal-unsigned.aab"

          ks="$RUNNER_TEMP/snappy.jks"
          mkdir -p status out
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
            KS_PASS="$KEYSTORE_PASSWORD_SECRET"
            KEY_ALIAS="$KEY_ALIAS_SECRET"
            KEY_PASS="${KEY_PASSWORD_SECRET:-$KEYSTORE_PASSWORD_SECRET}"
            label="release-signed"
            echo "android: signed with the project's release key." > status/android.txt
          else
            # A throwaway key made on this runner and discarded with it. It makes an installable file, but
            # every build has a different signature, so one cannot be installed over another.
            KS_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$KS_PASS"
            KEY_ALIAS="snappy-throwaway"
            KEY_PASS="$KS_PASS"
            export KS_PASS KEY_PASS
            keytool -genkeypair -keystore "$ks" -storepass:env KS_PASS -keypass:env KEY_PASS \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Snappy throwaway build key"
            label="debug-signed"
            echo "android: signed with a throwaway key (no release key secret). It cannot update an app installed from another build." > status/android.txt
          fi
          export KS_PASS KEY_ALIAS KEY_PASS
          cat status/android.txt

          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk="out/Snappy_${VERSION}_android-universal-${label}.apk"
          aab="out/Snappy_${VERSION}_android-universal-${label}.aab"

          # The APK was zip-aligned in the build job. apksigner (v2 and later) needs that done before it signs.
          # --v4-signing-enabled false: otherwise apksigner also writes an .idsig file next to the APK, and
          # everything in out/ gets published.
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --v4-signing-enabled false --out "$apk" "$unsigned_apk"
          "$bt/apksigner" verify "$apk"

          cp "$unsigned_aab" "$aab"
          jarsigner -keystore "$ks" -storepass:env KS_PASS -keypass:env KEY_PASS \
            -sigalg SHA256withRSA -digestalg SHA-256 "$aab" "$KEY_ALIAS" > /dev/null
          jarsigner -verify "$aab" > /dev/null

          rm -f "$ks"

          # Check the finished file once more: this is the file that gets shipped.
          perms=$("$bt/aapt2" dump permissions "$apk")
          echo "Permissions in the signed APK:"
          echo "$perms"
          if grep -q 'android.permission.INTERNET' <<< "$perms"; then
            echo "::error::The signed APK asks for the INTERNET permission."
            exit 1
          fi
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final-android
          path: out/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status-android
          path: status/android.txt
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------------
  # Provenance: a signed statement from GitHub that these exact files were produced by this workflow run on
  # this commit. No secrets, no checkout; it can write attestations and nothing else.
  # ---------------------------------------------------------------------------------------------
  attest:
    name: Attest build provenance
    needs: [verify, desktop, android, sign-windows, sign-macos, sign-android]
    if: ${{ !cancelled() && needs.verify.outputs.official == 'true' && needs.desktop.result == 'success' && needs.sign-windows.result == 'success' && needs.sign-macos.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: final-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  # ---------------------------------------------------------------------------------------------
  # Release: checksums, and a DRAFT GitHub Release. The only job that can write to the repository.
  # It never publishes, and it refuses to touch a release (draft or published) that already exists for the tag.
  # It runs no build code: it handles the finished files, gpg (when a key secret exists) and gh.
  # ---------------------------------------------------------------------------------------------
  release:
    name: Draft the GitHub Release
    needs: [verify, desktop, android, sign-windows, sign-macos, sign-android, attest]
    if: ${{ !cancelled() && needs.verify.outputs.official == 'true' && needs.desktop.result == 'success' && needs.sign-windows.result == 'success' && needs.sign-macos.result == 'success' && needs.attest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: final-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: status-*
          merge-multiple: true
          path: status
      - name: Write the checksums
        run: |
          set -euo pipefail
          cd dist
          ls -l
          # One line per file, in the format that `sha256sum -c` and `shasum -a 256 -c` read.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\0' | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Sign the checksums (only when a GPG key secret exists)
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.SNAPPY_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.SNAPPY_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "No GPG key secret: SHA256SUMS will not be signed."
            echo "signed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          keys=$(gpg --batch --list-keys --with-colons)
          awk -F: '$1 == "fpr" { print "Checksums signed with GPG key " $10; exit }' <<< "$keys"
          rm -rf "$GNUPGHOME"
          echo "signed=yes" >> "$GITHUB_OUTPUT"
      - name: Write the release notes (and say which files are missing)
        env:
          CHECKSUMS_SIGNED: ${{ steps.gpg.outputs.signed }}
        run: |
          set -euo pipefail
          missing_required=0
          missing_optional=0

          # list_files LABEL GLOB REQUIRED: print what is attached for one row, or say loudly that nothing is.
          list_files() {
            local label="$1" pattern="$2" required="$3" f
            local -a found=()
            mapfile -t found < <(compgen -G "dist/$pattern" || true)
            if [ "${#found[@]}" -gt 0 ]; then
              for f in "${found[@]}"; do echo "- $label: \`$(basename "$f")\`"; done
            elif [ "$required" = "yes" ]; then
              echo "- $label: **NOT ATTACHED.** The build did not produce it. Do not publish this draft."
              missing_required=$((missing_required + 1))
            else
              echo "- $label: **NOT ATTACHED.** Its job failed or was skipped in this run, so there is no $label file. Do not list it in the announcement."
              missing_optional=$((missing_optional + 1))
            fi
          }

          {
            echo "Snappy $VERSION, built from commit \`$COMMIT\`."
            echo
            echo "Edit this draft before publishing: say what changed, and say which platforms you tested by hand."
            echo
            echo "## Files attached"
            echo
            list_files "Windows installer (.exe)" "*.exe" yes
            list_files "Windows installer (.msi)" "*.msi" yes
            list_files "macOS, Apple silicon" "*aarch64*.dmg" yes
            list_files "macOS, Intel" "*x64.dmg" yes
            list_files "Linux AppImage" "*.AppImage" yes
            list_files "Linux .deb" "*.deb" yes
            list_files "Linux .rpm" "*.rpm" yes
            list_files "Android APK" "*android*.apk" no
            list_files "Android AAB" "*android*.aab" no
            echo "- Checksums: \`SHA256SUMS\`"
            if [ "$CHECKSUMS_SIGNED" = "yes" ]; then echo "- Checksums signature: \`SHA256SUMS.asc\`"; fi
            echo
            echo "## Signing"
            echo
            sed 's/^/- /' status/*.txt
            if [ "$CHECKSUMS_SIGNED" = "yes" ]; then
              echo "- SHA256SUMS is signed (SHA256SUMS.asc)."
            else
              echo "- SHA256SUMS is not signed."
            fi
            echo
            echo "## Verify your download"
            echo
            echo "See [docs/RELEASES.md](https://github.com/$GH_REPO/blob/$TAG/docs/RELEASES.md) for how to check a file against SHA256SUMS, how to check its build provenance with \`gh attestation verify\`, and what the first-run warnings mean."
          } > notes.md
          cat notes.md
          if [ "$missing_optional" -gt 0 ]; then
            echo "::warning::$missing_optional optional file row(s) are missing from this release (see the notes). The Android build has continue-on-error while it is unproven."
          fi
          if [ "$missing_required" -gt 0 ]; then
            echo "::error::$missing_required required file row(s) are missing. Not drafting a release."
            exit 1
          fi
      - name: Create the draft release
        env:
          # The write token reaches this step only, not the step that holds the GPG key.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Look through all releases, because a draft cannot be found by its tag. An existing release
          # (draft or published) is never touched: it may hold edited notes. Delete a stale draft by hand to re-run.
          existing=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | "\(.id) draft=\(.draft)"')
          if [ -n "$existing" ]; then
            echo "::error::A release for $TAG already exists ($existing). Not changing it. If it is a stale draft, delete it on GitHub and re-run this job."
            exit 1
          fi
          gh release create "$TAG" dist/* --draft --verify-tag \
            --title "Snappy $VERSION" --notes-file notes.md
          echo "Draft release is ready. It is NOT published; open it on GitHub, test the files and publish by hand."
