name: CI

# Secrets and pull requests
#   * This workflow references no secret at all, so a pull request from a fork or from Dependabot has
#     nothing to read. It uses the `pull_request` trigger (never `pull_request_target`, which would run
#     the pull request's code with the base repository's token and secrets).
#   * For those pull requests GitHub also hands the run a read-only token, whatever the file says.
#   * Every job states `permissions: contents: read`. apps/app/test/workflows.test.ts reads every workflow file
#     and fails on the common forms of a secret, a write permission, an unpinned action, a risky trigger
#     or an expression inside a script. It is a tripwire, not a proof: review workflow changes by hand too.
#     The `workflow-lint` job below runs actionlint for syntax.
#   * `npm ci --ignore-scripts`: no package install script runs (only esbuild has one; the build and the
#     tests were run without it).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a full commit SHA (the comment names the release). Dependabot bumps them.

jobs:
  test:
    name: Type check, tests and dashboard build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Tests
        run: npm test
      - name: Build the dashboard
        run: npm run build:dashboard

  # The Rust of the desktop shell, including the updater: its end-to-end tests talk to a server on 127.0.0.1 and use only
  # TEST keys. Windows only, because the updater is. (The loopback test feature is built by hand for the update drill and
  # is named in no workflow.)
  rust-tests:
    name: Desktop shell Rust tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # The shell embeds the built page, so the page is built first.
      - name: Build the page the shell embeds
        run: node apps/app/scripts/build-frontend.mjs
      - name: Unit and loopback tests
        working-directory: apps/app/src-tauri
        run: cargo test --lib --locked
      # The offline verifier that the daily check and the signing tool run, against files made with a throwaway TEST key:
      # a good release passes, and a changed installer, a wrong version and a wrong address fail. This keeps that
      # check from rotting between releases.
      - name: Verifier dry run
        run: node apps/app/tools/verify-dry-run.mjs

  # The desktop and phone shells must not gain a way to reach the network. This reads Cargo's
  # dependency tree for every release target (desktop and mobile) and fails if an HTTP client, a TLS
  # library or similar appears. It needs no system libraries and takes under a minute.
  no-network-deps:
    name: Shell has no network dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the Rust dependency tree
        run: node apps/app/tools/check-no-network-deps.mjs

  # Syntax and expression errors in the workflow files. The version is pinned and the download is checked against
  # a SHA-256 written below. The shell and Python checkers are off: they
  # would lint the signing scripts for style, and this job is only for the workflow syntax.
  workflow-lint:
    name: Workflow files pass actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to actionlint@v1.7.7 by checksum: the download must match the SHA-256 of that release's Linux tarball,
      # which was read from the release's own checksums file. Dependabot does not track this one. To move to a newer
      # release, change both values together and compare the new checksum with the release's checksums file.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -shellcheck= -pyflakes=
