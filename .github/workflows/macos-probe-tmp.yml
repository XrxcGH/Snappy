name: macOS probe (temporary)

# TEMPORARY: runs only the WebKit stand-in, so it can be tried in minutes instead of after a full build. Deleted before the pull
# request is finished. No secret, read-only token.

on:
  pull_request:
    paths:
      - ".github/workflows/macos-probe-tmp.yml"
      - "apps/app/tools/macos/**"

permissions:
  contents: read

jobs:
  probe:
    name: WebKit stand-in only
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the probe
        run: OUT=probe-out bash apps/app/tools/macos/probe.sh
      - name: Upload the output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-probe-tmp
          path: probe-out/*
          if-no-files-found: warn
          retention-days: 3
