<!doctype html>
<!-- Snappy icon preview: lists every symbol in icons.svg and the three confidence meters, using the design tokens. Open it in a browser. -->
<html lang="en-US">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snappy icons</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<style>
  main { max-width: var(--content-max); margin: 0 auto; padding: var(--space-6) var(--space-4); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: var(--space-3); margin-top: var(--space-4); }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-2); display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
  .tile code { font-size: var(--text-12); color: var(--text-muted); }
  svg.icon { width: 24px; height: 24px; }
  svg.big { width: 40px; height: 40px; }
  .conf { display: flex; gap: var(--space-4); margin-top: var(--space-4); flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-3); border-radius: var(--radius-sm); border: 1px solid; font-size: var(--text-14); font-weight: 600; }
  .pill.high { color: var(--conf-high-fg); background: var(--conf-high-bg); border-color: var(--conf-high-border); }
  .pill.medium { color: var(--conf-medium-fg); background: var(--conf-medium-bg); border-color: var(--conf-medium-border); }
  .pill.low { color: var(--conf-low-fg); background: var(--conf-low-bg); border-color: var(--conf-low-border); }
</style>
<main>
  <h1>Icons</h1>
  <div class="grid" id="grid"></div>
  <h2 style="margin-top:var(--space-8)">Confidence</h2>
  <div class="conf">
    <span class="pill high"><svg class="icon" aria-hidden="true"><use href="icons.svg#conf-high"/></svg>High</span>
    <span class="pill medium"><svg class="icon" aria-hidden="true"><use href="icons.svg#conf-medium"/></svg>Medium</span>
    <span class="pill low"><svg class="icon" aria-hidden="true"><use href="icons.svg#conf-low"/></svg>Low</span>
  </div>
</main>
<script>
  fetch("icons.svg").then(r => r.text()).then(t => {
    const ids = [...t.matchAll(/<symbol id="([^"]+)"/g)].map(m => m[1]).filter(i => i.startsWith("i-"));
    document.getElementById("grid").innerHTML = ids.map(id =>
      `<div class="tile"><svg class="icon big" aria-hidden="true"><use href="icons.svg#${id}"/></svg><code>${id}</code></div>`).join("");
  });
</script>
