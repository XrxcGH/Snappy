  <symbol id="i-calendar" viewBox="0 0 24 24"><rect class="s" x="4" y="5" width="16" height="15" rx="2"/><path class="s" d="M4 10h16M8.5 3v4M15.5 3v4"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path class="s" d="M9 6h11M9 12h11M9 18h11"/><circle class="f" cx="4.6" cy="6" r="1.3"/><circle class="f" cx="4.6" cy="12" r="1.3"/><circle class="f" cx="4.6" cy="18" r="1.3"/></symbol>
  <symbol id="i-storage" viewBox="0 0 24 24"><rect class="s" x="3" y="4.5" width="18" height="6" rx="2"/><rect class="s" x="3" y="13.5" width="18" height="6" rx="2"/><circle class="f" cx="7" cy="7.5" r="1.1"/><circle class="f" cx="7" cy="16.5" r="1.1"/></symbol>
  <symbol id="i-device" viewBox="0 0 24 24"><rect class="s" x="5" y="5" width="14" height="10" rx="2"/><path class="s" d="M3 19h18"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path class="s" d="M12 3l7 3v5.5c0 4.2-2.8 7.4-7 9.5-4.2-2.1-7-5.3-7-9.5V6z"/><path class="s" d="M9 12l2.2 2.2L15.5 10"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path class="s" d="M6 12h12"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle class="s" cx="12" cy="12" r="4"/><path class="s" d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path class="s" d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></symbol>

  <!-- ===== Spot illustrations: viewBox 0 0 160 120. Bars are 8 tall with rx 4. Colors come from the g-* classes (see the CSS contract). ===== -->
