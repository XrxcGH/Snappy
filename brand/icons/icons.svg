<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    Snappy icon set. 24x24 grid, 2px stroke, round caps and joins, 2px corner radius on
    rectangles. Everything uses currentColor.
    Usage: <svg class="icon" width="24" height="24" aria-hidden="true"><use href="icons.svg#i-search"/></svg>
    Decorative icons get aria-hidden; icon-only buttons get an aria-label on the button.
    Confidence meters (conf-*) pair with a text label; they never carry meaning alone.
  -->
  <defs>
    <style>
      .s{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .f{fill:currentColor;stroke:none}
    </style>
  </defs>

  <symbol id="i-content-blind" viewBox="0 0 24 24"><path class="s" d="M6 3h8l5 5v13H6zM14 3v5h5M9.5 11.5h5"/><rect class="f" x="9" y="14" width="8" height="3" rx="1.5"/></symbol>
  <symbol id="i-vanished" viewBox="0 0 24 24"><circle class="s" cx="12" cy="8" r="3.5" stroke-dasharray="2.2 2.4"/><path class="s" d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7" stroke-dasharray="2.6 2.6"/></symbol>
  <symbol id="i-one-way" viewBox="0 0 24 24"><path class="s" d="M3 12h12M11 7l5 5-5 5M20.5 6v12"/></symbol>
  <symbol id="i-quiet" viewBox="0 0 24 24"><path class="s" d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-memories" viewBox="0 0 24 24"><rect class="s" x="3" y="8" width="14" height="12" rx="2"/><path class="s" d="M7 4.5h12a2 2 0 0 1 2 2V16"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path class="s" d="M4 6h11M4 12h7M4 18h9"/><path class="s" d="M15.5 16.5l2.2 2.2 4-4.2"/></symbol>
  <symbol id="i-seal" viewBox="0 0 24 24"><rect class="s" x="5" y="11" width="14" height="9" rx="2"/><path class="s" d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-import" viewBox="0 0 24 24"><path class="s" d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><path class="s" d="M12 15V3M7 8l5-5 5 5M5 21h14"/></symbol>
  <symbol id="i-file-zip" viewBox="0 0 24 24"><rect class="s" x="3" y="4" width="18" height="5" rx="1.5"/><path class="s" d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path class="s" d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle class="s" cx="15" cy="7" r="2.5"/><circle class="s" cx="9" cy="17" r="2.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle class="s" cx="11" cy="11" r="6.5"/><path class="s" d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path class="s" d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path class="s" d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-warning" viewBox="0 0 24 24"><path class="s" d="M12 3.5l9.5 16.5h-19zM12 10v4"/><circle class="f" cx="12" cy="17.2" r="1.1"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle class="s" cx="12" cy="12" r="9"/><path class="s" d="M12 11v5"/><circle class="f" cx="12" cy="7.8" r="1.1"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect class="s" x="9" y="9" width="11" height="11" rx="2"/><path class="s" d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="i-remove" viewBox="0 0 24 24"><path class="s" d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path class="s" d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path class="s" d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>

  <!-- Confidence meters: bars stacked like the logo. Filled bar = reached, outlined bar = not reached. -->
  <symbol id="conf-high" viewBox="0 0 24 24"><rect class="f" x="3" y="4" width="18" height="4" rx="1.5"/><rect class="f" x="3" y="10" width="18" height="4" rx="1.5"/><rect class="f" x="3" y="16" width="18" height="4" rx="1.5"/></symbol>
  <symbol id="conf-medium" viewBox="0 0 24 24"><rect class="f" x="3" y="4" width="18" height="4" rx="1.5"/><rect class="f" x="3" y="10" width="18" height="4" rx="1.5"/><rect class="s" x="3.75" y="16.75" width="16.5" height="2.5" rx="1" stroke-width="1.5"/></symbol>
  <symbol id="conf-low" viewBox="0 0 24 24"><rect class="f" x="3" y="4" width="18" height="4" rx="1.5"/><rect class="s" x="3.75" y="10.75" width="16.5" height="2.5" rx="1" stroke-width="1.5"/><rect class="s" x="3.75" y="16.75" width="16.5" height="2.5" rx="1" stroke-width="1.5"/></symbol>
</svg>
