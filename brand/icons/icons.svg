  <symbol id="i-video" viewBox="0 0 24 24"><rect class="s" x="3" y="6" width="14" height="12" rx="2"/><path class="s" d="M17 10.5l4-2.5v8l-4-2.5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path class="s" d="M6 3h8l5 5v13H6zM14 3v5h5"/></symbol>
